# Replace <REGISTRY> with your image registry, e.g. us.icr.io/<namespace>/dealership-api:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
  namespace: cardealer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dealership-api
  template:
    metadata:
      labels:
        app: dealership-api
    spec:
      containers:
        - name: dealership-api
          image: <REGISTRY>/dealership-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api
  namespace: cardealer
spec:
  selector:
    app: dealership-api
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
