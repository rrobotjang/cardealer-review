<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Details - Best Cars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Best Cars</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="/dealers/">Dealers</a></li>
        </ul>
        <ul class="navbar-nav" id="authArea"></ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-5">
    <div class="container">
      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
      <div id="loading" class="spinner-border text-primary" role="status"></div>

      <div id="dealerInfo" class="d-none mb-4">
        <h1 id="dealerName" class="mb-1"></h1>
        <p id="dealerAddress" class="text-muted mb-3"></p>
        <a id="postReviewBtn" href="#" class="btn btn-success mb-4">Post a Review</a>
      </div>

      <h2 class="mb-3">Reviews</h2>
      <div id="reviewsRow" class="row g-4"></div>
      <div id="noReviews" class="text-muted d-none">No reviews yet. Be the first!</div>
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-auto">
    <div class="container text-muted">&copy; 2026 Best Cars &mdash; IBM Full Stack Developer Capstone Project</div>
  </footer>

  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item"><button class="nav-link active" id="loginTab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">Login</button></li>
            <li class="nav-item"><button class="nav-link" id="registerTab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">Register</button></li>
          </ul>
          <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>
          <div class="tab-content">
            <div class="tab-pane fade show active" id="loginPane">
              <form id="loginForm">
                <div class="mb-3"><input type="text" class="form-control" id="loginUsername" placeholder="Username" required></div>
                <div class="mb-3"><input type="password" class="form-control" id="loginPassword" placeholder="Password" required></div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
              </form>
            </div>
            <div class="tab-pane fade" id="registerPane">
              <form id="registerForm">
                <div class="mb-3"><input type="text" class="form-control" id="regFirstName" placeholder="First name"></div>
                <div class="mb-3"><input type="text" class="form-control" id="regLastName" placeholder="Last name"></div>
                <div class="mb-3"><input type="text" class="form-control" id="regUsername" placeholder="Username" required></div>
                <div class="mb-3"><input type="password" class="form-control" id="regPassword" placeholder="Password (min 8 chars)" required></div>
                <button type="submit" class="btn btn-success w-100">Register</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const authModal = new bootstrap.Modal(document.getElementById('authModal'));
    const authAlert = document.getElementById('authAlert');
    const authArea = document.getElementById('authArea');
    function showAuthAlert(msg) { authAlert.textContent = msg; authAlert.classList.remove('d-none'); }
    function clearAuthAlert() { authAlert.classList.add('d-none'); authAlert.textContent = ''; }
    function isLoggedIn() { return !!sessionStorage.getItem('jwt'); }
    function renderAuthArea() {
      authArea.innerHTML = '';
      if (isLoggedIn()) {
        const name = sessionStorage.getItem('first_name') || sessionStorage.getItem('username') || 'user';
        const li = document.createElement('li'); li.className = 'nav-item';
        li.innerHTML = '<span class="navbar-text me-3 text-white">Logged in as ' + name + '</span>';
        const logoutLi = document.createElement('li'); logoutLi.className = 'nav-item';
        const btn = document.createElement('button'); btn.className = 'btn btn-outline-light btn-sm'; btn.textContent = 'Logout';
        btn.onclick = () => { sessionStorage.removeItem('jwt'); sessionStorage.removeItem('username'); sessionStorage.removeItem('first_name'); sessionStorage.removeItem('last_name'); location.reload(); };
        logoutLi.appendChild(btn); authArea.append(li, logoutLi);
      } else {
        const li = document.createElement('li'); li.className = 'nav-item';
        const btn = document.createElement('button'); btn.className = 'btn btn-outline-light btn-sm'; btn.textContent = 'Login';
        btn.onclick = () => { clearAuthAlert(); authModal.show(); };
        li.appendChild(btn); authArea.appendChild(li);
      }
    }
    async function doLogin(username, password) {
      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      sessionStorage.setItem('jwt', data.access); sessionStorage.setItem('username', username);
      authModal.hide(); renderAuthArea();
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); clearAuthAlert();
      try { await doLogin(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value); e.target.reset(); }
      catch (err) { showAuthAlert(err.message); }
    });
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); clearAuthAlert();
      try {
        const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          first_name: document.getElementById('regFirstName').value, last_name: document.getElementById('regLastName').value,
          username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value }) });
        const data = await res.json();
        if (!res.ok) throw new Error(Object.values(data).flat().join(' '));
        sessionStorage.setItem('jwt', data.tokens.access); sessionStorage.setItem('username', data.username);
        sessionStorage.setItem('first_name', data.first_name); sessionStorage.setItem('last_name', data.last_name);
        authModal.hide(); renderAuthArea(); e.target.reset();
      } catch (err) { showAuthAlert(err.message); }
    });
    renderAuthArea();

    // --- Dealer details + reviews ---
    const params = new URLSearchParams(window.location.search);
    const dealerId = params.get('id');
    const alertBox = document.getElementById('alertBox');
    const loading = document.getElementById('loading');
    const dealerInfo = document.getElementById('dealerInfo');
    const reviewsRow = document.getElementById('reviewsRow');
    const noReviews = document.getElementById('noReviews');

    function sentimentBadge(sentiment) {
      const span = document.createElement('span');
      span.className = 'badge ms-2';
      if (sentiment === 'positive') { span.classList.add('text-bg-success'); span.textContent = 'Positive'; }
      else if (sentiment === 'negative') { span.classList.add('text-bg-danger'); span.textContent = 'Negative'; }
      else { span.classList.add('text-bg-secondary'); span.textContent = 'Neutral'; }
      return span;
    }

    function renderReviews(reviews) {
      reviewsRow.innerHTML = '';
      if (!reviews || reviews.length === 0) { noReviews.classList.remove('d-none'); return; }
      noReviews.classList.add('d-none');
      reviews.forEach((r) => {
        const col = document.createElement('div');
        col.className = 'col-md-6';
        const card = document.createElement('div');
        card.className = 'card h-100';
        const body = document.createElement('div');
        body.className = 'card-body';
        const title = document.createElement('h6');
        title.className = 'card-subtitle mb-2';
        title.textContent = r.name || 'Anonymous';
        title.appendChild(sentimentBadge(r.sentiment));
        const text = document.createElement('p');
        text.className = 'card-text';
        text.textContent = r.review;
        const meta = document.createElement('small');
        meta.className = 'text-muted';
        const carInfo = r.car_make || r.car_model || r.car_year
          ? [r.car_make, r.car_model, r.car_year].filter(Boolean).join(' ')
          : null;
        if (r.purchase) {
          meta.textContent = 'Purchased' + (carInfo ? ': ' + carInfo : '') + (r.purchase_date ? ' on ' + r.purchase_date : '');
        } else {
          meta.textContent = 'Not purchased' + (carInfo ? ' · ' + carInfo : '');
        }
        body.append(title, text, meta);
        card.appendChild(body);
        col.appendChild(card);
        reviewsRow.appendChild(col);
      });
    }

    (async () => {
      if (!dealerId) {
        loading.classList.add('d-none');
        alertBox.textContent = 'Missing dealership id (?id=N).';
        alertBox.classList.remove('d-none');
        return;
      }
      try {
        const [dealershipRes, reviewsRes] = await Promise.all([
          fetch('/api/dealerships/' + dealerId + '/'),
          fetch('/api/dealer/' + dealerId + '/reviews')
        ]);
        if (!dealershipRes.ok) throw new Error('Dealership not found (HTTP ' + dealershipRes.status + ')');
        const dealership = await dealershipRes.json();
        document.getElementById('dealerName').textContent = dealership.full_name;
        document.getElementById('dealerAddress').textContent = dealership.st + ', ' + dealership.city + ', ' + dealership.state + ' ' + dealership.zip;
        document.getElementById('postReviewBtn').href = '/postreview/?id=' + dealerId;
        dealerInfo.classList.remove('d-none');
        loading.classList.add('d-none');

        if (reviewsRes.ok) {
          const data = await reviewsRes.json();
          renderReviews(data.reviews);
        } else {
          reviewsRow.innerHTML = '';
          const col = document.createElement('div');
          col.className = 'col-12';
          const alert = document.createElement('div');
          alert.className = 'alert alert-warning';
          alert.textContent = 'Unable to load reviews (HTTP ' + reviewsRes.status + ')';
          col.appendChild(alert);
          reviewsRow.appendChild(col);
        }
      } catch (err) {
        loading.classList.add('d-none');
        alertBox.textContent = 'Error: ' + err.message;
        alertBox.classList.remove('d-none');
      }
    })();
  </script>
</body>
</html>
