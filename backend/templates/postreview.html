<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Review - Best Cars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Best Cars</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="/dealers/">Dealers</a></li>
        </ul>
        <ul class="navbar-nav" id="authArea"></ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <h1 class="mb-4">Post a Review</h1>

          <div id="loginWarning" class="alert alert-warning d-none">
            Please <a href="#" id="openLoginBtn">login</a> to post a review.
          </div>

          <form id="reviewForm" class="d-none">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="reviewName" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Dealership</label>
              <input type="text" class="form-control" id="reviewDealership" readonly>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Car Make</label>
                <select class="form-select" id="reviewMake">
                  <option value="">Select make</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Car Model</label>
                <input type="text" class="form-control" id="reviewModel" placeholder="e.g. Model 3">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Car Year</label>
                <input type="number" class="form-control" id="reviewYear" min="1990" max="2027" placeholder="e.g. 2023">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label d-block">Did you purchase a car here?</label>
                <div class="form-check form-check-inline mt-2">
                  <input class="form-check-input" type="radio" name="purchaseRadio" id="purchaseYes" value="true">
                  <label class="form-check-label" for="purchaseYes">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="purchaseRadio" id="purchaseNo" value="false" checked>
                  <label class="form-check-label" for="purchaseNo">No</label>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Purchase Date</label>
              <input type="date" class="form-control" id="reviewPurchaseDate" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Your Review</label>
              <textarea class="form-control" id="reviewText" rows="5" required placeholder="Tell us about your experience..."></textarea>
            </div>
            <button type="submit" class="btn btn-success" id="submitBtn">
              <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
              <span id="submitLabel">Submit Review</span>
            </button>
            <a href="/dealers/" class="btn btn-outline-secondary ms-2">Cancel</a>
          </form>

          <div id="resultBox" class="mt-4"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-auto">
    <div class="container text-muted">&copy; 2026 Best Cars &mdash; IBM Full Stack Developer Capstone Project</div>
  </footer>

  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item"><button class="nav-link active" id="loginTab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">Login</button></li>
            <li class="nav-item"><button class="nav-link" id="registerTab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">Register</button></li>
          </ul>
          <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>
          <div class="tab-content">
            <div class="tab-pane fade show active" id="loginPane">
              <form id="loginForm">
                <div class="mb-3"><input type="text" class="form-control" id="loginUsername" placeholder="Username" required></div>
                <div class="mb-3"><input type="password" class="form-control" id="loginPassword" placeholder="Password" required></div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
              </form>
            </div>
            <div class="tab-pane fade" id="registerPane">
              <form id="registerForm">
                <div class="mb-3"><input type="text" class="form-control" id="regFirstName" placeholder="First name"></div>
                <div class="mb-3"><input type="text" class="form-control" id="regLastName" placeholder="Last name"></div>
                <div class="mb-3"><input type="text" class="form-control" id="regUsername" placeholder="Username" required></div>
                <div class="mb-3"><input type="password" class="form-control" id="regPassword" placeholder="Password (min 8 chars)" required></div>
                <button type="submit" class="btn btn-success w-100">Register</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const authModal = new bootstrap.Modal(document.getElementById('authModal'));
    const authAlert = document.getElementById('authAlert');
    const authArea = document.getElementById('authArea');
    function showAuthAlert(msg) { authAlert.textContent = msg; authAlert.classList.remove('d-none'); }
    function clearAuthAlert() { authAlert.classList.add('d-none'); authAlert.textContent = ''; }
    function isLoggedIn() { return !!sessionStorage.getItem('jwt'); }
    function renderAuthArea() {
      authArea.innerHTML = '';
      if (isLoggedIn()) {
        const name = sessionStorage.getItem('first_name') || sessionStorage.getItem('username') || 'user';
        const li = document.createElement('li'); li.className = 'nav-item';
        li.innerHTML = '<span class="navbar-text me-3 text-white">Logged in as ' + name + '</span>';
        const logoutLi = document.createElement('li'); logoutLi.className = 'nav-item';
        const btn = document.createElement('button'); btn.className = 'btn btn-outline-light btn-sm'; btn.textContent = 'Logout';
        btn.onclick = () => { sessionStorage.removeItem('jwt'); sessionStorage.removeItem('username'); sessionStorage.removeItem('first_name'); sessionStorage.removeItem('last_name'); location.reload(); };
        logoutLi.appendChild(btn); authArea.append(li, logoutLi);
      } else {
        const li = document.createElement('li'); li.className = 'nav-item';
        const btn = document.createElement('button'); btn.className = 'btn btn-outline-light btn-sm'; btn.textContent = 'Login';
        btn.onclick = () => { clearAuthAlert(); authModal.show(); };
        li.appendChild(btn); authArea.appendChild(li);
      }
    }
    async function doLogin(username, password) {
      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      sessionStorage.setItem('jwt', data.access); sessionStorage.setItem('username', username);
      authModal.hide(); renderAuthArea(); enableReviewForm();
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); clearAuthAlert();
      try { await doLogin(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value); e.target.reset(); }
      catch (err) { showAuthAlert(err.message); }
    });
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); clearAuthAlert();
      try {
        const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          first_name: document.getElementById('regFirstName').value, last_name: document.getElementById('regLastName').value,
          username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value }) });
        const data = await res.json();
        if (!res.ok) throw new Error(Object.values(data).flat().join(' '));
        sessionStorage.setItem('jwt', data.tokens.access); sessionStorage.setItem('username', data.username);
        sessionStorage.setItem('first_name', data.first_name); sessionStorage.setItem('last_name', data.last_name);
        authModal.hide(); renderAuthArea(); enableReviewForm();
      } catch (err) { showAuthAlert(err.message); }
    });
    renderAuthArea();

    // --- Review form ---
    const params = new URLSearchParams(window.location.search);
    const dealerId = params.get('id');
    const loginWarning = document.getElementById('loginWarning');
    const reviewForm = document.getElementById('reviewForm');
    const resultBox = document.getElementById('resultBox');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');

    document.getElementById('openLoginBtn').addEventListener('click', (e) => {
      e.preventDefault();
      clearAuthAlert();
      authModal.show();
    });

    document.querySelectorAll('input[name="purchaseRadio"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        document.getElementById('reviewPurchaseDate').disabled = !(document.getElementById('purchaseYes').checked);
      });
    });

    function enableReviewForm() {
      if (!isLoggedIn()) return;
      loginWarning.classList.add('d-none');
      reviewForm.classList.remove('d-none');
      const first = sessionStorage.getItem('first_name');
      const last = sessionStorage.getItem('last_name');
      const user = sessionStorage.getItem('username');
      document.getElementById('reviewName').value = [first, last].filter(Boolean).join(' ') || user || '';
      document.getElementById('reviewDealership').value = 'Dealership #' + dealerId;
    }

    (async () => {
      if (!dealerId) {
        resultBox.innerHTML = '<div class="alert alert-danger">Missing dealership id (?id=N).</div>';
        return;
      }
      // Populate car makes
      try {
        const res = await fetch('/api/carmakes');
        if (res.ok) {
          const makes = await res.json();
          const select = document.getElementById('reviewMake');
          makes.forEach((m) => {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name;
            select.appendChild(opt);
          });
        }
      } catch (err) { /* non-fatal: make selector stays empty */ }

      if (!isLoggedIn()) {
        loginWarning.classList.remove('d-none');
      } else {
        enableReviewForm();
      }
    })();

    reviewForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultBox.innerHTML = '';
      const jwt = sessionStorage.getItem('jwt');
      if (!jwt) { loginWarning.classList.remove('d-none'); reviewForm.classList.add('d-none'); return; }

      submitSpinner.classList.remove('d-none');
      submitBtn.disabled = true;
      try {
        const payload = {
          name: document.getElementById('reviewName').value,
          dealership: Number(dealerId),
          review: document.getElementById('reviewText').value,
          purchase: document.getElementById('purchaseYes').checked,
          car_make: document.getElementById('reviewMake').value || null,
          car_model: document.getElementById('reviewModel').value || null,
          car_year: document.getElementById('reviewYear').value ? Number(document.getElementById('reviewYear').value) : null,
        };
        const purchaseDate = document.getElementById('reviewPurchaseDate').value;
        if (payload.purchase && purchaseDate) payload.purchase_date = purchaseDate;

        const res = await fetch('/api/dealer/' + dealerId + '/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwt },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.status === 401) {
          sessionStorage.removeItem('jwt'); sessionStorage.removeItem('username');
          sessionStorage.removeItem('first_name'); sessionStorage.removeItem('last_name');
          renderAuthArea();
          loginWarning.classList.remove('d-none');
          reviewForm.classList.add('d-none');
          resultBox.innerHTML = '<div class="alert alert-warning">Session expired, please login.</div>';
          return;
        }
        if (!res.ok) {
          throw new Error((data && data.error) ? data.error : 'Failed to post review (HTTP ' + res.status + ')');
        }
        const sentiment = data.sentiment;
        resultBox.innerHTML =
          '<div class="alert alert-success">Review posted! Sentiment: ' + (sentiment || 'n/a') +
          '. <a href="/dealer/?id=' + dealerId + '">Back to dealership</a></div>';
        e.target.reset();
      } catch (err) {
        resultBox.innerHTML = '<div class="alert alert-danger">' + err.message + '</div>';
      } finally {
        submitSpinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
