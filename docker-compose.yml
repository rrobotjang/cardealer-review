version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: cardealer-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  dealership-api:
    build: ./dealership-api
    container_name: cardealer-dealership-api
    environment:
      - PORT=3000
    ports:
      - "3000:3000"

  reviews-api:
    build: ./reviews-api
    container_name: cardealer-reviews-api
    depends_on:
      - mongo
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/reviews
      - JWT_SECRET=super-secret-key-for-dev
    ports:
      - "3001:3000"

  sentiment-analyzer:
    build: ./sentiment-analyzer
    container_name: cardealer-sentiment-analyzer
    environment:
      - PORT=5000
    ports:
      - "5000:5000"

  backend:
    build: ./backend
    container_name: cardealer-backend
    depends_on:
      - dealership-api
      - reviews-api
      - sentiment-analyzer
    environment:
      - DJANGO_SECRET_KEY=dev-django-secret-key
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DEALERSHIP_API_URL=http://dealership-api:3000
      - REVIEWS_API_URL=http://reviews-api:3000
      - SENTIMENT_API_URL=http://sentiment-analyzer:5000
      - JWT_SECRET=super-secret-key-for-dev
    ports:
      - "8000:8000"

volumes:
  mongo-data:
